<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · AutoPWN Suite</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/login.css">
  <script src="/i18n.js" defer></script>
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="login-card">
    <div class="brand">AUTOPWN <span>SUITE</span></div>
    <label class="login-lang-switch" for="login-lang">
      <span class="sr-only" data-i18n="settings.language">Language</span>
      <select id="login-lang" data-i18n-lang-select>
        <option value="en" data-i18n="lang.english">English</option>
        <option value="tr" data-i18n="lang.turkish">Türkçe</option>
      </select>
    </label>
    <h1 data-i18n="login.heading">Sign in</h1>
    <p data-i18n="login.subtitle">Use your dashboard account to manage scans.</p>
    <form id="login-form" method="post" action="/login">
      <label for="login-username" data-i18n="settings.username">Username</label>
      <input id="login-username" name="username" autocomplete="username" maxlength="64" required autofocus>
      <label for="login-password" data-i18n="login.password_label">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
      <p id="login-message" role="status" aria-live="polite"></p>
      <button id="login-submit" type="submit" disabled data-i18n="login.submit">Sign in</button>
    </form>
    <p class="hint" data-i18n="login.hint">First launch? Your account details are shown in the server terminal.</p>
  </main>
</body>
</html>
