name: Independent human review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  pull-requests: read

jobs:
  human-review:
    name: Independent human approval
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Require a human other than the author on the current revision
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const number = context.payload.pull_request.number;
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
            if (pr.head.sha !== context.payload.pull_request.head.sha) {
              core.setFailed('This check belongs to an older PR revision.');
              return;
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews, {...context.repo, pull_number: number});
            const latest = new Map();
            for (const review of reviews) {
              if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) {
                latest.set(review.user.id, review);
              }
            }
            const approved = [...latest.values()].some(review =>
              review.user.type === 'User' && review.user.id !== pr.user.id &&
              review.state === 'APPROVED' && review.commit_id === pr.head.sha);
            if (!approved) core.setFailed('A non-author human must approve the current revision. Bot and AI reviews do not count.');
