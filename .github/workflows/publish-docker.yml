name: Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to build and sign (for example v2.7.0; tags before v2.7.0 lack the packaging files and are refused)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  validate:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
      latest: ${{ steps.release.outputs.latest }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release input and archive reviewed source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/assets"
          commit="$(python scripts/release_assets.py prepare --tag "$RELEASE_TAG" --output "$assets")"
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r .draft <<< "$release")" = false
          test "$(jq '.assets | length' <<< "$release")" = 0
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          # Commit time of the reviewed release commit; fixes image timestamps.
          epoch="$(git show --no-patch --format=%ct "$commit")"
          [[ "$epoch" =~ ^[0-9]+$ ]]
          {
            printf 'commit=%s\nversion=%s\nsource_date_epoch=%s\n' "$commit" "${RELEASE_TAG#v}" "$epoch"
            printf 'image=%s\n' docker.io/gamehunterkaan/autopwn-suite
            if [ "$latest" = "$RELEASE_TAG" ]; then printf 'latest=true\n'; else printf 'latest=false\n'; fi
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error

  source-security:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml
    with:
      source-ref: ${{ needs.validate.outputs.commit }}

  dynamic-analysis:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/dynamic-analysis.yml
    with:
      source-ref: ${{ needs.validate.outputs.commit }}

  binaries:
    needs: [validate, source-security]
    permissions:
      contents: read
    uses: ./.github/workflows/build-binary.yml
    with:
      source-artifact: release-source
      source-date-epoch: ${{ needs.validate.outputs.source_date_epoch }}

  build:
    needs: [validate, source-security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source
      - name: Extract the exact source archive produced by release validation
        run: |
          set -euo pipefail
          mkdir source
          tar --extract --gzip --file "$RUNNER_TEMP/release-source/autopwn-suite-$RELEASE_TAG.tar.gz" --strip-components=1 --directory source
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install checksum-pinned SBOM and dependency scanners
        run: python scripts/install_security_tools.py --directory "$RUNNER_TEMP/security-tools" --syft
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image without publication credentials
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: source
          platforms: linux/${{ matrix.arch }}
          push: false
          tags: autopwn-release:${{ matrix.arch }}
          # Repeatable build inputs: SOURCE_DATE_EPOCH is the release commit time;
          # rewrite-timestamp clamps file mtimes in layers to it (BuildKit >= 0.13).
          build-args: |
            SOURCE_DATE_EPOCH=${{ needs.validate.outputs.source_date_epoch }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar,rewrite-timestamp=true
      - name: Generate SBOM and gate actual image dependencies before publication
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          "$RUNNER_TEMP/security-tools/syft" scan "docker-archive:$RUNNER_TEMP/image.tar" -o "cyclonedx-json=$RUNNER_TEMP/assets/autopwn-suite-$RELEASE_TAG-linux-$ARCH.cdx.json"
          python scripts/security_policy.py --repo source --output "$RUNNER_TEMP/reports" --osv "$RUNNER_TEMP/security-tools/osv-scanner" --image-archive "$RUNNER_TEMP/image.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.arch }}
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
      - name: Retain image scan results including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-security-${{ matrix.arch }}
          path: ${{ runner.temp }}/reports/
          if-no-files-found: error

  push:
    needs: [validate, build, dynamic-analysis, binaries]
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: images
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push checked images and assemble versioned image
        id: image
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          VERSION: ${{ needs.validate.outputs.version }}
          IS_LATEST: ${{ needs.validate.outputs.latest }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker load --input "images/image-$arch/image.tar"
            docker tag "autopwn-release:$arch" "$IMAGE:$VERSION-$arch"
            docker push "$IMAGE:$VERSION-$arch"
          done
          tags=(--tag "$IMAGE:$VERSION")
          if [[ "$IS_LATEST" = true && "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then tags+=(--tag "$IMAGE:latest" --tag "$IMAGE:${VERSION%.*}"); fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | jq -r .)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  sign:
    needs: [validate, push, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: assets
          merge-multiple: true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Bind and sign release assets and image digest
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          DIGEST: ${{ needs.push.outputs.digest }}
        run: |
          set -euo pipefail
          python scripts/release_assets.py manifest --tag "$RELEASE_TAG" --output assets --image "$IMAGE" --digest "$DIGEST" --binaries
          identity="https://github.com/$GITHUB_WORKFLOW_REF"
          cosign sign --yes "$IMAGE@$DIGEST"
          # Docker Hub can list a just-pushed signature late; cosign v3 then falls back to the legacy .sig tag and
          # exits 10 ("no signatures found"). Ask again before failing; the identity, issuer and digest are unchanged.
          verified=false
          for delay in 0 5 10 15 20 30 30; do
            sleep "$delay"
            if cosign verify --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE@$DIGEST"; then verified=true; break; fi
          done
          [ "$verified" = true ]
          cosign sign-blob --yes --bundle assets/release-manifest.sigstore.json assets/release-manifest.json
          cosign verify-blob --bundle assets/release-manifest.sigstore.json --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com assets/release-manifest.json
          # The checksum file gets its own signature so the binaries can be verified with two standard commands.
          cosign sign-blob --yes --bundle assets/SHA256SUMS.sigstore.json assets/SHA256SUMS
          cosign verify-blob --bundle assets/SHA256SUMS.sigstore.json --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com assets/SHA256SUMS
          # SLSA provenance over the release manifest, which binds the hash of every release file.
          python scripts/release_provenance.py --manifest assets/release-manifest.json --output "$RUNNER_TEMP/provenance.json"
          cosign attest-blob --yes --type slsaprovenance1 --predicate "$RUNNER_TEMP/provenance.json" --bundle "assets/autopwn-suite-$RELEASE_TAG.intoto.jsonl" assets/release-manifest.json
          cosign verify-blob-attestation --type slsaprovenance1 --bundle "assets/autopwn-suite-$RELEASE_TAG.intoto.jsonl" --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com assets/release-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release
          path: assets/
          if-no-files-found: error

  publish:
    needs: [validate, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release
          path: assets
      - name: Publish signed assets and descriptive notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unzip -p "assets/autopwn-suite-$RELEASE_TAG-security.zip" release-notes.md > "$RUNNER_TEMP/release-notes.md"
          gh release upload "$RELEASE_TAG" assets/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --repo "$GITHUB_REPOSITORY"
