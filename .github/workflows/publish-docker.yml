name: Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to build and sign (for example v2.6.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  validate:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release input and archive reviewed source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/assets"
          commit="$(python scripts/release_assets.py prepare --tag "$RELEASE_TAG" --output "$assets")"
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r .draft <<< "$release")" = false
          test "$(jq '.assets | length' <<< "$release")" = 0
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          {
            printf 'commit=%s\nversion=%s\n' "$commit" "${RELEASE_TAG#v}"
            printf 'image=%s\n' docker.io/gamehunterkaan/autopwn-suite
            if [ "$latest" = "$RELEASE_TAG" ]; then printf 'latest=true\n'; else printf 'latest=false\n'; fi
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-source
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error

  source-security:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml
    with:
      source-ref: ${{ needs.validate.outputs.commit }}

  build:
    needs: [validate, source-security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install checksum-pinned SBOM and dependency scanners
        run: python scripts/install_security_tools.py --directory "$RUNNER_TEMP/security-tools" --syft
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image without publication credentials
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: source
          platforms: linux/${{ matrix.arch }}
          push: false
          tags: autopwn-release:${{ matrix.arch }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
      - name: Generate SBOM and gate actual image dependencies before publication
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          "$RUNNER_TEMP/security-tools/syft" scan "docker-archive:$RUNNER_TEMP/image.tar" -o "cyclonedx-json=$RUNNER_TEMP/assets/autopwn-suite-$RELEASE_TAG-linux-$ARCH.cdx.json"
          python scripts/security_policy.py --repo source --output "$RUNNER_TEMP/reports" --osv "$RUNNER_TEMP/security-tools/osv-scanner" --image-archive "$RUNNER_TEMP/image.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.arch }}
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
      - name: Retain image scan results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-security-${{ matrix.arch }}
          path: ${{ runner.temp }}/reports/
          if-no-files-found: error

  push:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          path: images
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push checked images and assemble versioned image
        id: image
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          VERSION: ${{ needs.validate.outputs.version }}
          IS_LATEST: ${{ needs.validate.outputs.latest }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker load --input "images/image-$arch/image.tar"
            docker tag "autopwn-release:$arch" "$IMAGE:$VERSION-$arch"
            docker push "$IMAGE:$VERSION-$arch"
          done
          tags=(--tag "$IMAGE:$VERSION")
          if [[ "$IS_LATEST" = true && "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then tags+=(--tag "$IMAGE:latest" --tag "$IMAGE:${VERSION%.*}"); fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | jq -r .)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  sign:
    needs: [validate, push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-source
          path: assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sbom-*
          path: assets
          merge-multiple: true
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Bind and sign release assets and image digest
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          DIGEST: ${{ needs.push.outputs.digest }}
        run: |
          set -euo pipefail
          python scripts/release_assets.py manifest --tag "$RELEASE_TAG" --output assets --image "$IMAGE" --digest "$DIGEST"
          identity="https://github.com/$GITHUB_WORKFLOW_REF"
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE@$DIGEST"
          cosign sign-blob --yes --bundle assets/release-manifest.sigstore.json assets/release-manifest.json
          cosign verify-blob --bundle assets/release-manifest.sigstore.json --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com assets/release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release
          path: assets/
          if-no-files-found: error

  publish:
    needs: [validate, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release
          path: assets
      - name: Publish signed assets and descriptive notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" assets/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --notes-file assets/release-notes.md --repo "$GITHUB_REPOSITORY"
