name: Security policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      source-ref:
        description: Validated release commit to scan
        type: string
        default: ''

permissions:
  contents: read

jobs:
  security-policy:
    name: Security policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate optional release commit
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          [[ -z "$SOURCE_REF" || "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned security tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r .security/requirements-bandit.txt
          python scripts/install_security_tools.py --directory "$RUNNER_TEMP/security-tools"
      - name: Evaluate every change against SCA and SAST policy
        run: |
          python scripts/security_policy.py --repo source --output "$RUNNER_TEMP/security-reports" --osv "$RUNNER_TEMP/security-tools/osv-scanner"
      - name: Retain scanner results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-policy-reports
          path: ${{ runner.temp }}/security-reports/
          if-no-files-found: error
          retention-days: 30
