name: Install smoke tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  wheel:
    name: Wheel on ${{ matrix.os }} / Python ${{ matrix.python }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python }}
    - name: Build the wheel
      run: python -m pip wheel . --no-deps --wheel-dir dist
    - name: Install it into a clean virtual environment and start it
      shell: bash
      run: |
        set -euo pipefail
        python -m venv "$RUNNER_TEMP/venv"
        bin="$RUNNER_TEMP/venv/bin"
        [ -d "$bin" ] || bin="$RUNNER_TEMP/venv/Scripts"
        "$bin/python" -m pip install dist/*.whl
        version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)"
        python scripts/smoke_install.py "$version" "$bin/autopwn-suite"

  source:
    name: Source archive
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      source_date_epoch: ${{ steps.archive.outputs.source_date_epoch }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Archive the commit the way the release does
      id: archive
      run: |
        set -euo pipefail
        version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)"
        mkdir out
        git archive --format=tar.gz --prefix="autopwn-suite-v${version}/" --output="out/autopwn-suite-v${version}.tar.gz" HEAD
        printf 'source_date_epoch=%s\n' "$(git log -1 --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: release-source
        path: out/
        if-no-files-found: error
        retention-days: 1

  binaries:
    name: Standalone binaries
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/build-binary.yml
    with:
      source-artifact: release-source
      source-date-epoch: ${{ needs.source.outputs.source_date_epoch }}
