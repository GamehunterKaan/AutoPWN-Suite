name: Install smoke tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  wheel:
    name: Wheel on ${{ matrix.os }} / Python ${{ matrix.python }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python }}
    - name: Build the wheel
      run: python -m pip wheel . --no-deps --wheel-dir dist
    - name: Install it into a clean virtual environment and start it
      shell: bash
      run: |
        set -euo pipefail
        python -m venv "$RUNNER_TEMP/venv"
        bin="$RUNNER_TEMP/venv/bin"
        [ -d "$bin" ] || bin="$RUNNER_TEMP/venv/Scripts"
        "$bin/python" -m pip install dist/*.whl
        version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)"
        python scripts/smoke_install.py "$version" "$bin/autopwn-suite"

  source:
    name: Source archive
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      source_date_epoch: ${{ steps.archive.outputs.source_date_epoch }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Archive the commit the way the release does
      id: archive
      run: |
        set -euo pipefail
        version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)"
        mkdir out
        git archive --format=tar.gz --prefix="autopwn-suite-v${version}/" --output="out/autopwn-suite-v${version}.tar.gz" HEAD
        printf 'source_date_epoch=%s\n' "$(git log -1 --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-source
        path: out/
        if-no-files-found: error
        retention-days: 1

  binaries:
    name: Standalone binaries
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/build-binary.yml
    with:
      source-artifact: release-source
      source-date-epoch: ${{ needs.source.outputs.source_date_epoch }}
