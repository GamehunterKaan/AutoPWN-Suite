name: Poetry Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
      with:
        version: '2.5.1'

    - name: Set up cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

    - name: Validate lockfile
      run: poetry check --lock

    - name: Install dependencies
      run: poetry install

    - name: Check coding standards, JavaScript syntax and locked container inputs
      run: |
        poetry run ruff check .
        node --check autopwn_suite/web_ui_static/app.js
        node --check autopwn_suite/web_ui_static/web_security.js
        node --check autopwn_suite/web_ui_static/auth.js
        node --check autopwn_suite/web_ui_static/login.js
        npx --yes eslint@10.12.0 --config eslint.config.mjs autopwn_suite/web_ui_static
        poetry run python scripts/export_locked_requirements.py --check

    - name: Install system Nmap and gettext
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y nmap gettext

    - name: Check translation catalogs are up to date
      run: poetry run python scripts/i18n_messages.py check --lang tr

    - name: Run tests
      run: poetry run pytest
