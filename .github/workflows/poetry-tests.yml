name: Poetry Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: '2.5.1'

    - name: Set up cache
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

    - name: Validate lockfile
      run: poetry check --lock

    - name: Install dependencies
      run: poetry install

    - name: Install system Nmap for loopback integration tests
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y nmap

    - name: Run tests
      run: poetry run test
