name: Build binaries

# Reusable: builds the standalone single-file binaries and smoke-tests each of them on the runner that built
# it. Pull requests build the triggering commit through install-smoke.yml; the release workflow passes the
# artifact holding the exact source archive its validation job produced and publishes the output.
on:
  workflow_call:
    inputs:
      source-artifact:
        description: Artifact with the validated release source archive; empty builds the triggering commit
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    permissions:
      contents: read
    # Oldest runner images that are still supported, so the Linux binaries run on older glibc versions.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-22.04
            suffix: ""
          - target: linux-arm64
            runner: ubuntu-22.04-arm
            suffix: ""
          - target: windows-amd64
            runner: windows-2022
            suffix: ".exe"
          - target: macos-arm64
            runner: macos-14
            suffix: ""
    env:
      TARGET: ${{ matrix.target }}
      SUFFIX: ${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: inputs.source-artifact == ''
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.source-artifact != ''
        with:
          name: ${{ inputs.source-artifact }}
          path: ${{ runner.temp }}/release-source
      - name: Extract the exact source archive produced by release validation
        if: inputs.source-artifact != ''
        shell: bash
        run: |
          set -euo pipefail
          # Relative archive name: GNU tar reads "D:\..." on Windows as a remote host. The destination goes through
          # pwd for the same reason: GITHUB_WORKSPACE is D:\a\repo\repo there, and tar reads "\a" in --directory as an escape.
          cd "$RUNNER_TEMP/release-source"
          dest="$(cd "$GITHUB_WORKSPACE" && pwd)"
          tar --extract --gzip --file autopwn-suite-v*.tar.gz --strip-components=1 --directory "$dest"
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install hash-pinned dependencies and PyInstaller
        shell: bash
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps \
            -r requirements-locked.txt -r packaging/requirements-build.txt
      - name: Build
        shell: bash
        run: pyinstaller --clean --noconfirm packaging/autopwn-suite.spec
      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)"
          python scripts/smoke_install.py "$version" "dist/autopwn-suite$SUFFIX"
      - name: Give the binary its release name and describe what it bundles
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)"
          mkdir binaries
          cp "dist/autopwn-suite$SUFFIX" "binaries/autopwn-suite-v${version}-${TARGET}${SUFFIX}"
          # The packages frozen into this binary depend on the platform, so the SBOM comes from this build environment.
          python scripts/binary_sbom.py --version "$version" --target "$TARGET" --output "binaries/autopwn-suite-v${version}-binary-${TARGET}.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: binaries/*
          if-no-files-found: error
          retention-days: 7
