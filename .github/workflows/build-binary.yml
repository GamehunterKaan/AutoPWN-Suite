name: Build binaries

# Reusable: builds the standalone single-file binaries twice, requires both builds to be identical, and smoke-tests
# each binary on the runner that built it. Pull requests build the triggering commit through install-smoke.yml; the
# release workflow passes the artifact holding the exact source archive its validation job produced and publishes
# the output. The interpreter is the one packaging/build-python.json pins by SHA-256, so the result does not depend
# on the runner image (docs/BUILDING.md explains how to rebuild a published binary).
on:
  workflow_call:
    inputs:
      source-artifact:
        description: Artifact with the validated release source archive; empty builds the triggering commit
        type: string
        default: ''
      source-date-epoch:
        description: Commit time of the source in seconds, used as SOURCE_DATE_EPOCH
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    permissions:
      contents: read
    # One runner per platform and architecture. The binary does not use the runner's Python or libraries.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-22.04
            suffix: ""
          - target: linux-arm64
            runner: ubuntu-22.04-arm
            suffix: ""
          - target: windows-amd64
            runner: windows-2022
            suffix: ".exe"
          - target: macos-arm64
            runner: macos-14
            suffix: ""
    env:
      TARGET: ${{ matrix.target }}
      SUFFIX: ${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: inputs.source-artifact == ''
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.source-artifact != ''
        with:
          name: ${{ inputs.source-artifact }}
          path: ${{ runner.temp }}/release-source
      - name: Extract the exact source archive produced by release validation
        if: inputs.source-artifact != ''
        shell: bash
        run: |
          set -euo pipefail
          # Relative archive name: GNU tar reads "D:\..." on Windows as a remote host. The destination goes through
          # pwd for the same reason: GITHUB_WORKSPACE is D:\a\repo\repo there, and tar reads "\a" in --directory as an escape.
          cd "$RUNNER_TEMP/release-source"
          dest="$(cd "$GITHUB_WORKSPACE" && pwd)"
          tar --extract --gzip --file autopwn-suite-v*.tar.gz --strip-components=1 --directory "$dest"
      - name: Set up Python to run the build script
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Build twice with the pinned toolchain and require identical bytes
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ inputs.source-date-epoch }}
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          # The script downloads the interpreter pinned in packaging/build-python.json, verifies its SHA-256, installs
          # the hash-pinned requirements and PyInstaller into a virtual environment of it and builds the binary twice.
          python scripts/build_binary.py --target "$TARGET" --work-dir "$RUNNER_TEMP/binary-build" --repeat \
            --output "dist/autopwn-suite$SUFFIX"
          sha256sum "dist/autopwn-suite$SUFFIX" 2>/dev/null || shasum -a 256 "dist/autopwn-suite$SUFFIX"
      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)"
          python scripts/smoke_install.py "$version" "dist/autopwn-suite$SUFFIX"
      - name: Give the binary its release name and describe what it bundles
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)"
          mkdir binaries
          cp "dist/autopwn-suite$SUFFIX" "binaries/autopwn-suite-v${version}-${TARGET}${SUFFIX}"
          # The packages frozen into this binary depend on the platform, so the SBOM comes from this build environment.
          python="$RUNNER_TEMP/binary-build/venv/bin/python"
          [ -x "$python" ] || python="$RUNNER_TEMP/binary-build/venv/Scripts/python.exe"
          "$python" scripts/binary_sbom.py --version "$version" --target "$TARGET" --output "binaries/autopwn-suite-v${version}-binary-${TARGET}.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: binaries/*
          if-no-files-found: error
          retention-days: 7
