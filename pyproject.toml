[tool.poetry]
name = "autopwn-suite"
version = "2.7.0"
requires-poetry = "==2.5.1"
description = "AutoPWN Suite - Automated Vulnerability Scanning and Exploitation Tool"
authors = ["AutoPWN Suite Contributors"]
readme = "README.md"
license = "Apache-2.0"
homepage = "https://github.com/GamehunterKaan/AutoPWN-Suite"
repository = "https://github.com/GamehunterKaan/AutoPWN-Suite"
keywords = ["security", "penetration-testing", "vulnerability-scanner", "exploitation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
packages = [
    { include = "autopwn_suite" }
]

[tool.poetry.dependencies]
python = "^3.10"
requests = ">=2.33.0"
rich = "*"
beautifulsoup4 = "*"
distro = "*"
urllib3 = "^2.8.0"
cryptography = ">=50.0.0"
flask = "^3.1.3"
flask-cors = "^6.0.2"
werkzeug = "^3.1.9"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"
ruff = "==0.17.1"

[tool.poetry.scripts]
autopwn-suite = "autopwn_suite.cli:run"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=autopwn_suite",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=80",
    "-vv",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Maximum practical strictness without making third-party deprecations (which vary by
# Python version) fail unrelated changes: warnings raised by this project's own code are errors.
filterwarnings = [
    "error::SyntaxWarning",
    'error::DeprecationWarning:autopwn_suite(\..*)?$',
    'error::FutureWarning:autopwn_suite(\..*)?$',
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["autopwn_suite"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/virtualenv/*",
    "*/.venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
force-exclude = true
# PEP 8 with a 200-column limit; see docs/CODING_STANDARDS.md for the rationale.
line-length = 200
# `_` and `ngettext` are installed into builtins by autopwn_suite.i18n (gettext), so they are not undefined names.
builtins = ["_", "ngettext"]

[tool.ruff.lint]
# E/W: PEP 8 (pycodestyle), F: Pyflakes, B: flake8-bugbear, I: sorted imports.
select = ["E", "W", "F", "B", "I"]

[tool.ruff.lint.per-file-ignores]
# Long user-facing explanations and generated-HTML templates are kept as single literals.
"autopwn_suite/web/details.py" = ["E501"]
"autopwn_suite/web/poc.py" = ["E501"]
# Actions passed to run_task()/probe helpers execute inside the same loop iteration,
# so the late-binding hazard B023 warns about cannot occur.
"autopwn_suite/web/additional.py" = ["B023"]
"autopwn_suite/web/dirbust.py" = ["B023"]
"autopwn_suite/web/webvuln.py" = ["B023"]
"autopwn_suite/web_ui.py" = ["B023"]
# Test fixtures embed long HTML, header and JSON literals.
"tests/**" = ["B023", "E501"]
